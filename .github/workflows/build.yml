name: Build ClickCount                 # ← any name you like

on:
  push:
    tags: ['v*']                       # ← which tags start a build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'       # ← same Python as on your PC

      - name: Install PyInstaller      # ← step labels: free text
        run: python -m pip install pyinstaller   # ← what your app needs installed

      - name: Build exe
        run: pyinstaller ClickCount.spec         # ← your build command

      - name: Save exe
        uses: actions/upload-artifact@v4
        with:
          name: ClickCount                       # ← download name
          path: dist/ClickCount.exe              # ← where your exe ends up

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ClickCount.exe             # ← what goes into the release