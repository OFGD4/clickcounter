name: Build ClickCount                 # ← any name you like

on:
  push:
    tags: ['v*']                       # ← which tags start a build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'       # ← same Python as on your PC

      - name: Install PyInstaller      # ← step labels: free text
        run: python -m pip install pyinstaller   # ← what your app needs installed

      - name: Use the tag as the app version
        if: github.ref_type == 'tag'
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          (Get-Content version.py) -replace "VERSION = .*", "VERSION = '$v'" | Set-Content version.py
          Get-Content version.py
          if (-not (Select-String -Quiet "VERSION = '$v'" version.py)) { throw "version.py was not updated" }


      - name: Build exe
        run: pyinstaller ClickCount.spec         # ← your build command

      - name: Save exe
        uses: actions/upload-artifact@v4
        with:
          name: ClickCount                       # ← download name
          path: dist/*.exe  
          
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: |
          $v = python -c "import version; print(version.VERSION)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer.iss

      
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe             # ← what goes into the release